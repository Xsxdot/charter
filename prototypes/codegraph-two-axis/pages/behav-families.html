<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>行为轴 · 入口全景</title><link rel="stylesheet" href="../shared/style.css">
<script src="../shared/mock.js"></script><script src="../shared/nav.js"></script></head><body>
<script>
const c = shell({ title: '行为轴 · 入口全景', nav: 'behav', depth: 1, crumb: '系统在做什么' })
const chan = q('ch', 'HTTP')
const chans = [...new Set(CG.families.map(f => f.channel))]
const fams = CG.families.filter(f => f.channel === chan)
const sel = q('f', fams[0] && fams[0].name)
const cur = fams.find(f => f.name === sel) || fams[0]
const seg = chans.map(ch => `<a class="seg-i${ch === chan ? ' on' : ''}" href="?ch=${encodeURIComponent(ch)}">${ch} (${CG.families.filter(f => f.channel === ch).reduce((a, f) => a + f.entryCount, 0)})</a>`).join('')
const rows = fams.map(f => {
  const nd = f.domains.length
  const cls = nd >= 8 ? 'd4' : nd >= 6 ? 'd3' : nd >= 4 ? 'd2' : 'ok'
  return `<a class="sub-card${f.name === cur.name ? ' sel' : ''}" href="?ch=${encodeURIComponent(chan)}&f=${encodeURIComponent(f.name)}">
    <div class="t mono" style="font-size:12.5px">${f.name}</div>
    <div class="readouts"><span class="ro">${f.entryCount} 入口</span>
      <span class="ro ${cls}" title="这一族触达的领域数——越多说明这条业务能力越散">触达 ${nd} 域</span>
      <span class="ro">可达 ${f.reachable} 符号</span></div></a>`
}).join('')
const ents = cur.entries.map(e => `<div class="row">
  <span><a class="mono" href="behav-flow.html?e=${encodeURIComponent(e.id)}">${e.name}</a>
  ${e.outDegree === 0 ? '<span class="ro d2" title="图里这个入口没有任何出边">无出边</span>' : e.outDegree === 1 ? '<span class="ro d1" title="图只建到 entry→handler 一跳">仅一跳</span>' : ''}</span>
  <span class="mono muted">${e.file}</span></div>`).join('')
c.innerHTML = `<div class="banner">入口是一等公民。<b>触达域数就是散度读数</b>——一族碰的领域越多，这条业务能力越散。<br>
注意 <b>162 个入口里 137 个只有一条出边</b>：不是代码只有一跳，是扫的时候没往下走（AI 扫的实测缺陷，见 roadmap 27/28）。</div>
<div class="seg" style="margin-bottom:10px">${seg}</div>
<div class="split"><div class="subs-grid">${rows}</div>
<aside class="side">
  <div class="card"><h3 class="mono">${cur.name}</h3>
    <div class="row"><span>入口数</span><span class="mono">${cur.entryCount}</span></div>
    <div class="row"><span>可达符号</span><span class="mono">${cur.reachable}</span></div>
    <div class="row"><span>触达领域</span><span class="mono">${cur.domains.length}</span></div></div>
  <div class="card" style="margin-top:10px"><h3>触达的领域</h3>
    ${cur.domains.map(d => `<div class="row"><span><a href="../index.html?scope=${d.id}">${d.label}</a></span><span class="mono">${d.symbols}</span></div>`).join('')}
    <div class="muted" style="font-size:11px;margin-top:6px">← 这些链接就是两轴的交汇：从行为跳进结构。</div></div>
  <div class="card" style="margin-top:10px"><h3>入口</h3>${ents}</div>
</aside></div>`
document.querySelectorAll('.seg-i').forEach(a => a.className = a.className.replace('seg-i', '') || '')
</script>
<style>.seg a,.seg .seg-i{padding:3px 9px;font-size:11.5px;text-decoration:none;color:var(--muted);background:var(--bg);display:inline-block}
.seg .seg-i.on{background:var(--accent);color:var(--accent-fg)}</style>
</body></html>
