<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>入口流程图</title><link rel="stylesheet" href="../shared/style.css">
<script src="../shared/mock.js"></script><script src="../shared/flowmock.js"></script><script src="../shared/nav.js"></script></head><body>
<script>
// 第二根轴：从一个程序入口出发的流程图。结构轴（index.html）回答「由什么组成」，
// 这一轴回答「一次调用怎么走」。两轴在这里交汇：流程图的每个跨域节点都是下层的一个入口。
const eid = q('e', 'e_cli_card_dispatch')
const A = CGFLOW[eid]                 // 手抽的真流程（有次序、有分支）
const M = CG.flows[eid]               // 机械可达序列（今天 baseline 能给的全部）
const name = A ? A.entry : M ? M.entry : eid
const c = shell({ title: '入口流程图', nav: 'behav', depth: 1,
  crumb: `<a href="../index.html">全系统</a> ▸ <a href="behav-families.html">入口清单</a> ▸ <b>${name}</b>` })

// ── 流程图布局 ───────────────────────────────────────────
// 形态判据（与结构轴同一条）：方向靠箭头不靠位置；能看见全部节点时空白最少、线交叉最少。
// 主干一条竖线，提前返回甩到一侧，分支体缩进成子干并留一条「否」旁路绕回。
// 分支画菱形、调用画矩形：这就是「switch/if 通过流程图展示，调用方法展示在不同节点」。
//
// 折列走**蛇形**（用户裁决 2026-08-26）：第 1 列自上而下，走到底从下面接进第 2 列，
// 第 2 列自下而上，走到顶再从上面接进第 3 列。不是每列都从头开始、拿一条长线绕回去——
// 那条绕回线会横穿整张图。蛇形的接续段永远只有一小段，且落在图的边缘带里。
const BW = 192, BH = 38, DH = 44, GAP = 20, IND = 34, XW = 124, COLW = BW + IND + 28 + XW + 34
const TOP = 46, BAND = 30           // 上下各留一条带子给接续段走
function stepH(s) {
  if (s.kind === 'branch') return DH + GAP + (s.body ? s.body.reduce((a, b) => a + stepH(b), 0) + 8 : 0)
  return BH + GAP
}
function layoutOnce(A, cols, limit) {
  const N = [], E = []
  let col = 0, y = TOP, prev = null, maxX = 0, pendingWrap = null
  const X = () => 14 + col * COLW
  const start = { x: X(), y, w: BW, h: 34, kind: 'start', id: 'n0', col, s: { label: A.entry, line: A.line } }
  N.push(start); y += 34 + GAP; maxX = X() + BW; prev = start
  function box(s, x, kind) {
    const h = kind === 'branch' ? DH : BH
    const nd = { x, y, w: BW, h, s, kind, col, id: 'n' + N.length }
    N.push(nd); y += h + GAP; maxX = Math.max(maxX, x + BW); return nd
  }
  function link(b) {   // 接上一步；若刚折过列，这一步就是接续段的落点
    if (pendingWrap) { pendingWrap.b = b; pendingWrap = null }
    else if (prev) E.push({ a: prev, b })
  }
  function walk(steps, x, depth) {
    steps.forEach(s => {
      if (depth === 0 && y + stepH(s) > limit && col < cols - 1) {
        const from = prev
        col++; y = TOP; x = X()
        E.push({ a: from, b: null, wrap: true }); pendingWrap = E[E.length - 1]; prev = null
      }
      if (s.kind === 'branch') {
        const d = box(s, x, 'branch'); link(d)
        if (s.exit) {
          const t = { x: x + BW + 28, y: d.y + 8, w: XW, h: 26, s, kind: 'exit', col, id: 'n' + N.length }
          N.push(t); maxX = Math.max(maxX, t.x + t.w); E.push({ a: d, b: t, side: true })
          prev = d
        } else if (s.body) {
          prev = d
          const inner = walk(s.body, x + IND, depth + 1)
          const rejoin = { x, y, w: 0, h: 0, kind: 'join', col, id: 'n' + N.length }
          N.push(rejoin); y += 10
          E.push({ a: d, b: rejoin, bypass: true, gx: x - 18 })
          if (inner && inner !== d) E.push({ a: inner, b: rejoin, thin: true })
          if (s.bodyEnds) N[N.indexOf(inner)].ends = s.bodyEnds
          prev = rejoin
        } else prev = d
      } else { const b = box(s, x, s.kind); link(b); prev = b }
    })
    return prev
  }
  walk(A.steps, X(), 0)
  // 奇数列整列上下翻转 = 蛇形。翻转的是坐标，连线一律按坐标现算方向，
  // 所以箭头自动跟着朝上——不需要为反向列另写一套画法。
  const BOT = Math.max(...N.map(n => n.y + n.h))
  N.forEach(n => { if (n.col % 2) n.y = TOP + BOT - (n.y + n.h) })
  return { N, E, W: maxX + 30, H: BOT + TOP, TOP, BOT, cols }
}
// 列数由画布宽度定死，逐列高度则要**均摊**——末列没有折点，limit 取小了它会一路长下去，
// 前面几列却早早停住，接续段被迫拉一条长尾巴。所以试几个 limit，挑最矮的那次。
function buildFlow(A, availW, availH) {
  const cols = Math.max(1, Math.min(4, Math.floor(availW / COLW)))
  if (cols === 1) return layoutOnce(A, 1, Infinity)
  const totalH = 34 + GAP + A.steps.reduce((a, s) => a + stepH(s), 0)
  const floor = availH - TOP - BAND
  let best = null
  for (let k = 0; k <= 8; k++) {
    const r = layoutOnce(A, cols, Math.max(floor, Math.ceil(totalH / cols) * (1 + k * 0.06)))
    if (!best || r.BOT < best.BOT) best = r
  }
  return best
}
const DOMC = { d_ledger: '#4338ca', d_coordination_api: '#0891b2', d_runtime_policy: '#ca8a04' }
function drawFlow(el, A) {
  const { N, E, W, H, TOP: _T, BOT, cols } = buildFlow(A, el.clientWidth || 860, el.clientHeight || 560)
  const eSvg = E.map(e => {
    if (e.wrap) {   // 蛇形接续段：源列朝下就走下带，朝上就走上带；两端都接同一侧的边
      const down = e.a.col % 2 === 0
      const ax = e.a.x + (e.a.w || BW) / 2, ay = down ? e.a.y + (e.a.h || 0) : e.a.y
      const bx = e.b.x + (e.b.w || BW) / 2, by = down ? e.b.y + e.b.h : e.b.y
      const gy = down ? BOT + BAND - 8 : TOP - BAND + 8
      return `<path d="M${ax},${ay} V${gy} H${bx} V${by}" fill="none" stroke="#52525b" stroke-width="1.6"
        stroke-linejoin="round" marker-end="url(#fa)"/>
        <rect x="${(ax + bx) / 2 - 30}" y="${gy - 8}" width="60" height="16" rx="8" fill="#fff" stroke="#d4d4d8"/>
        <text x="${(ax + bx) / 2}" y="${gy + 3.5}" font-size="9" fill="#52525b" text-anchor="middle">${down ? '接下列 ↑' : '接下列 ↓'}</text>`
    }
    if (e.bypass) {   // 「否」旁路：从菱形侧尖出去，沿列外侧绕过分支体再回主干
      const ay = e.a.y + e.a.h / 2
      return `<path d="M${e.a.x},${ay} H${e.gx} V${e.b.y} H${e.b.x + BW / 2}" fill="none"
        stroke="#a1a1aa" stroke-width="1.3" marker-end="url(#fa)"/>
        <text x="${e.gx - 3}" y="${ay - 5}" font-size="9.5" fill="#71717a" text-anchor="end">否</text>`
    }
    if (e.side) {     // 提前返回：横甩到旁边的终点
      const ax = e.a.x + BW, ay = e.a.y + e.a.h / 2
      return `<path d="M${ax},${ay} H${e.b.x}" fill="none" stroke="#c62f04" stroke-width="1.3" marker-end="url(#fx)"/>
        <text x="${ax + 6}" y="${ay - 5}" font-size="9.5" fill="#c62f04">是</text>`
    }
    // 主干边：谁在上谁在下由坐标决定，锚点跟着换——反向列里箭头自然朝上。
    const ac = e.a.y + (e.a.h || 0) / 2, bc = e.b.y + (e.b.h || 0) / 2, up = bc < ac
    const ax = e.a.x + (e.a.w || BW) / 2, ay = up ? e.a.y : e.a.y + (e.a.h || 0)
    const bx = e.b.x + (e.b.w || BW) / 2, by = up ? e.b.y + (e.b.h || 0) : e.b.y
    const mid = ay + (up ? -11 : 11)
    const lb = e.a.kind === 'branch' ? `<text x="${ax + 5}" y="${ay + (up ? -4 : 13)}" font-size="9.5" fill="#71717a">否</text>` : ''
    return `<path d="M${ax},${ay} ${ax === bx ? `V${by}` : `V${mid} H${bx} V${by}`}" fill="none"
      stroke="${e.thin ? '#c8c8ce' : '#8a8a92'}" stroke-width="${e.thin ? 1 : 1.4}" marker-end="url(#fa)"/>${lb}`
  }).join('')
  const nSvg = N.map((nd, i) => {
    const s = nd.s || {}
    if (nd.kind === 'join' || nd.kind === 'hop') return ''
    if (nd.kind === 'start') return `<g><rect x="${nd.x}" y="${nd.y}" width="${nd.w}" height="${nd.h}" rx="17" fill="#18181b"/>
      <text x="${nd.x + 13}" y="${nd.y + 22}" font-size="11.5" font-weight="600" fill="#fafafa">▶ ${s.label}</text></g>`
    if (nd.kind === 'exit') return `<g><rect x="${nd.x}" y="${nd.y}" width="${nd.w}" height="${nd.h}" rx="14" fill="#fff5f2" stroke="#e2641f"/>
      <text x="${nd.x + 10}" y="${nd.y + 18}" font-size="9.5" fill="#c62f04">↩ ${s.exit.length > 17 ? s.exit.slice(0, 16) + '…' : s.exit}</text></g>`
    if (nd.kind === 'branch') {
      const cx = nd.x + BW / 2, cy = nd.y + nd.h / 2
      return `<g><path d="M${nd.x},${cy} L${cx},${nd.y} L${nd.x + BW},${cy} L${cx},${nd.y + nd.h} Z" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.1"/>
        <text x="${cx}" y="${cy}" font-size="10" text-anchor="middle">${s.cond.length > 24 ? s.cond.slice(0, 23) + '…' : s.cond}</text>
        <text x="${cx}" y="${cy + 11}" font-size="8.5" fill="#a1a1aa" text-anchor="middle">:${s.line}${s.bodyInline ? ' · 是 → ' + s.bodyInline : ''}</text></g>`
    }
    if (nd.kind === 'return') return `<g><rect x="${nd.x}" y="${nd.y}" width="${nd.w}" height="${nd.h}" rx="17" fill="#f0fdf4" stroke="#16a34a"/>
      <text x="${nd.x + 13}" y="${nd.y + 24}" font-size="10.5" fill="#166534">■ ${s.label}</text></g>`
    const col = DOMC[s.domain] || '#a1a1aa'
    // 接口调用画双线框：代码里写的是接口，走到哪个实现是运行期的事——图上不替它猜。
    return `<g class="fnd" data-i="${i}" style="cursor:pointer">
      ${s.iface ? `<rect x="${nd.x - 4}" y="${nd.y - 4}" width="${nd.w + 8}" height="${nd.h + 8}" rx="9"
        fill="none" stroke="#0891b2" stroke-width="1" stroke-dasharray="4 3"/>` : ''}
      <rect x="${nd.x}" y="${nd.y}" width="${nd.w}" height="${nd.h}" rx="7"
        fill="${s.iface ? '#ecfeff' : s.entry ? '#f5f3ff' : '#fff'}"
        stroke="${s.iface ? '#0891b2' : s.entry ? '#7c3aed' : '#c8c8ce'}" stroke-width="${s.heavy ? 1.8 : 1.1}"/>
      <rect x="${nd.x}" y="${nd.y}" width="3.5" height="${nd.h}" rx="2" fill="${col}"/>
      <text x="${nd.x + 11}" y="${nd.y + 16}" font-size="10.5" font-family="ui-monospace,Menlo,monospace">${s.label.length > 25 ? s.label.slice(0, 24) + '…' : s.label}</text>
      <text x="${nd.x + 11}" y="${nd.y + 29}" font-size="8.5" fill="#71717a">:${s.line} · ${s.domainLabel}${s.reuse ? ' · 被 ' + s.reuse + ' 处调用' : ''}</text>
      ${s.entry ? `<text x="${nd.x + BW - 9}" y="${nd.y + 24}" font-size="12" fill="#7c3aed" text-anchor="end">▸</text>` : ''}
      ${s.iface ? `<text x="${nd.x + BW - 9}" y="${nd.y + 16}" font-size="8.5" fill="#0891b2" text-anchor="end">接口 · ${s.impls.length} 实现</text>` : ''}
      ${s.resolves ? `<text x="${nd.x + BW - 9}" y="${nd.y + 16}" font-size="8.5" fill="#0891b2" text-anchor="end">解析出 ${s.resolves}</text>` : ''}
      ${nd.ends ? `<text x="${nd.x + BW + 8}" y="${nd.y + 24}" font-size="9" fill="#71717a">↩ ${nd.ends}</text>` : ''}
    </g>`
  }).join('')
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block">
  <defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b6b73"/></marker>
  <marker id="fx" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c62f04"/></marker></defs>
  ${eSvg}${nSvg}</svg>`
  return N
}

// ── 右栏三 tab ───────────────────────────────────────────
const tab = q('t', 'info')
const tabs = [['info', '基本信息'], ['debt', '复用与抽象债'], ['chain', '调用链（给 agent）']]
const panelInfo = A ? `<div class="card"><h3 class="mono">${A.entry}</h3>
    <div class="row"><span>源</span><span class="mono muted">${A.file}:${A.line}</span></div>
    <div class="row"><span>归属子系统</span><span><a href="../index.html?scope=${A.domain}">${A.domainLabel}</a></span></div>
    <div class="row"><span>步骤 / 分支</span><span class="mono">${A.steps.length} / ${A.steps.filter(s => s.kind === 'branch').length}</span></div>
    <div class="row"><span>下层入口</span><span class="mono">${A.steps.concat(...A.steps.map(s => s.body || [])).filter(s => s.entry).length}</span></div>
    <div class="row"><span>接口调用</span><span class="mono">${A.steps.filter(s => s.iface).length}</span></div></div>
  ${A.implOf ? `<div class="card" style="margin-top:10px" ><h3>它是一个实现</h3>
    <p style="font-size:12px;margin:0">这张图是 <span class="mono">${A.implOf.iface}</span> 的一个实现的流程。
    <br><a href="?e=${A.implOf.from}">← 回到调用它的接口那一层</a></p></div>` : ''}
  ${A.abridged ? `<div class="card" style="margin-top:10px"><h3>这是承重摘要</h3>
    <p style="font-size:12px;margin:0">${A.abridged}</p>
    <div class="muted" style="font-size:11px;margin-top:5px">「流程图收哪些步骤」是 schema 草案 §7 的未决项之一。折了什么必须写出来——不写就等于谎称这就是全部。</div></div>` : ''}
  <div class="card" style="margin-top:10px" id="pick"><h3>选一个节点</h3>
    <p class="muted" style="font-size:12px;margin:0">点流程图里的调用节点看它的注释。<b style="color:#7c3aed">紫框 ▸</b> 的节点本身是下层入口——它有自己的流程图。</p></div>
  <div class="card" style="margin-top:10px"><h3>这张图是怎么来的</h3>
    <p style="font-size:12px;margin:0 0 6px">手抽自源码，按 schema 草案 §2 的 <span class="mono">baseline.flows</span> 形状。每步都带行号，对着源码逐行可核。</p>
    <div class="empty" style="border-color:var(--debt3);background:#fff8f3"><b>今天扫不出来</b>：baseline 里没有控制流——没有步骤次序，也没有 if/switch。
      SSA 的 CFG 能精确给出（roadmap 32/27）。<b>原型先定形态，扫描侧再补数据。</b></div></div>` : ''
const panelDebt = A ? `<div class="card"><h3>复用与抽象的债</h3>
  <p class="muted" style="font-size:11.5px;margin:0 0 8px">这一栏的读数只有把「入口 → 流程图 → 节点即下层入口」递归展开才拿得到。平铺的调用边给不出。</p>
  ${A.debt.map(d => `<div class="lane" style="border-left:3px solid ${d.t === 'warn' ? 'var(--debt3)' : 'var(--ok)'}">
    <div class="hd">${d.t === 'warn' ? '⚠︎ ' : '✓ '}${d.h}</div>
    <div class="muted" style="font-size:11.5px">${d.d}</div></div>`).join('')}</div>` : ''
const panelChain = `<div class="card"><h3>机械可达序列</h3>
  <p class="muted" style="font-size:11.5px;margin:0 0 6px">按调用边逐跳展开，<b>没有次序也没有分支</b>。这就是今天 baseline 的全部——它对人没用，
    但对 agent 有用（要的是「碰过谁」，不是「怎么走」）。所以它留在这个 tab 里，不占中间画布。</p>
  ${M ? M.steps.map(s => `<div class="lane"><div class="hd">第 ${s.depth} 跳 · ${s.crossings.length} 个符号</div>
    ${s.crossings.map(x => `<div class="step${x.catchall ? ' noise' : ''}">
      <span class="mono">${x.from} → ${x.name}</span>
      <span class="pill" style="font-size:10px">${x.domainLabel}</span></div>`).join('')}</div>`).join('')
    : '<div class="empty">这个入口没有预抽的可达数据。原型只对 4 个入口抽了：' + Object.values(CG.flows).map(f => f.entry).join(' · ') + '</div>'}</div>`

const others = Object.keys(CGFLOW).filter(k => k !== eid)
c.innerHTML = `<div class="banner" style="flex:0 0 auto"><b>每个入口必有一张流程图。</b>紫框节点本身是下一层的入口——它有自己的流程图。
  这条递归线正是<b>复用和抽象的债</b>看得见的地方（右栏第二个 tab）。</div>
<div class="stage">
  <div class="pane-l"><div class="card">
    <h3 style="padding:2px 4px 6px;flex:0 0 auto">流程图${A ? '' : ' —— 本入口没有手抽数据'}</h3>
    <div id="cv" style="overflow:auto">${A ? '' : `<div class="empty" style="margin:12px">
原型手抽了三条真流程作样板：${Object.keys(CGFLOW).map(k => `<a href="?e=${k}">${CGFLOW[k].entry.split('（')[0]}</a>`).join(' · ')}。<br>
      其余入口今天只有机械可达序列（右栏「调用链」tab）。<b>形态确认后，数据由扫描侧补齐（roadmap 27/32）。</b></div>`}</div>
    <div class="legend">
      <span><b>▶</b> 入口</span><span><b style="color:#ca8a04">◇</b> 分支</span>
      <span><b style="color:#7c3aed">▸ 紫框</b> 本身是下层入口</span>
      <span><b style="color:#c62f04">↩</b> 提前返回</span><span>左侧色条 = 所属领域</span>
      <span><b style="color:#0891b2">╌ 双线框</b> 接口调用</span>
      <span><b>蛇形折列</b>：第 1 列自上而下，从底部接进第 2 列；第 2 列自下而上，从顶部接进第 3 列</span>
      <span>其他手抽的流程：${others.map(k => `<a href="?e=${k}">${CGFLOW[k].entry.split('（')[0]}</a>`).join(' · ')}</span>
    </div>
  </div></div>
  <div class="splitter" id="sp"></div>
  <div class="pane-r">
    <div class="rtabs">${tabs.map(([k, t]) => `<a href="?e=${eid}&t=${k}" class="${k === tab ? 'on' : ''}">${t}</a>`).join('')}</div>
    <div id="rbody">${tab === 'debt' ? panelDebt : tab === 'chain' ? panelChain : panelInfo}</div>
  </div>
</div>`
// 画布拿到真实尺寸之后才排版——折几列取决于画布多宽，不是写死的。
const N = A ? drawFlow(document.getElementById('cv'), A) : []
// 点节点 → 右栏显示它的注释
function bindNodes() { document.querySelectorAll('.fnd').forEach(g => g.addEventListener('click', () => {
  const s = N[+g.dataset.i].s, el = document.getElementById('pick'); if (!el) return
  el.innerHTML = `<h3 class="mono">${s.label}</h3>
    <div class="row"><span>位置</span><span class="mono muted">${s.to || '—'} · :${s.line}</span></div>
    <div class="row"><span>领域</span><span>${s.domainLabel}</span></div>
    ${s.reuse ? `<div class="row"><span>被几处调用</span><span class="mono">${s.reuse}</span></div>` : ''}
    ${s.note ? `<p style="font-size:12px;margin:8px 0 0">${s.note}</p>` : ''}
    ${s.entry ? `<div class="empty" style="margin-top:8px;border-color:#7c3aed;background:#faf8ff">
      <b>它本身是下层入口</b>——有自己的流程图。${s.entryOf ? `<br><a href="?e=${s.entryOf}">进入它的流程 →</a>`
        : '<br><span class="muted">原型没手抽这一条，下钻到此为止。</span>'}</div>` : ''}
    ${s.iface ? `<div class="empty" style="margin-top:8px;border-color:#0891b2;background:#f0fdff;text-align:left">
      <b>这是一个接口调用</b>——图上展示接口，因为代码里写的就是它；走到哪个实现是运行期由注册表决定的。</div>
      <h3 style="margin-top:10px">${s.impls.length} 个实现</h3>
      <div class="muted" style="font-size:11px;margin-bottom:5px">每个实现的入口，就是那个实现的流程图起点。</div>
      ${s.impls.map(im => `<div class="row"><span>${im.entryOf ? `<a class="mono" href="?e=${im.entryOf}">${im.label}</a>` : `<span class="mono">${im.label}</span>`}
        ${im.note ? `<span class="ro">${im.note}</span>` : ''}${im.entryOf ? '' : '<span class="ro muted">原型未抽</span>'}</span>
        <span class="mono muted" style="font-size:10px">${im.file.split('/').pop()}</span></div>`).join('')}` : ''}`
})) }
bindNodes()
;(() => {   // 分隔条拖动（与结构轴同一套）
  const sp = document.getElementById('sp'), r = document.querySelector('.pane-r')
  const saved = localStorage.getItem('cg.rw'); if (saved) r.style.flexBasis = saved + 'px'
  let d = null
  sp.addEventListener('mousedown', ev => { d = { x: ev.clientX, w: r.getBoundingClientRect().width }; ev.preventDefault(); document.body.style.cursor = 'col-resize' })
  window.addEventListener('mousemove', ev => { if (!d) return
    const w = Math.max(240, Math.min(window.innerWidth * .6, d.w + (d.x - ev.clientX)))
    r.style.flexBasis = w + 'px'; localStorage.setItem('cg.rw', Math.round(w)) })
  window.addEventListener('mouseup', () => { if (d) { d = null; document.body.style.cursor = ''; redraw() } })
})()
// 画布宽度变了就重排——折几列是画布尺寸的函数，不是一次性写死的布局。
let rt = null
function redraw() { if (!A) return
  clearTimeout(rt); rt = setTimeout(() => { const n = drawFlow(document.getElementById('cv'), A)
    N.length = 0; n.forEach(x => N.push(x)); bindNodes() }, 60) }
window.addEventListener('resize', redraw)
</script></body></html>
