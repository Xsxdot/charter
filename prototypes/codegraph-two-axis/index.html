<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>代码图查看器</title><link rel="stylesheet" href="shared/style.css">
<script src="shared/mock.js"></script><script src="shared/nav.js"></script><script src="shared/graph.js"></script></head><body>
<script>
// 一个页面承载每一层。变的只有 scope：空 = 根（12 个子系统），否则 = 某个领域。
// 子系统就是顶层领域——所以没有单独的「领域页」，也没有「进领域」这个动作。
const scope = q('scope', ''), sel = q('n', '')
const S = CG.scopes[scope || '__root__']
const SUB = CG.subsystems, SE = CG.subEntries
const isRoot = !scope
const crumb = ['<a href="?">全系统</a>'].concat(S.path.map((d, i) =>
  i === S.path.length - 1 ? `<b>${CG.scopes[d].decl.label}</b>` : `<a href="?scope=${d}">${CG.scopes[d].decl.label}</a>`)).join(' ▸ ')
const c = shell({ title: isRoot ? '代码图查看器 · 全系统' : S.decl.label, nav: 'home', depth: 0, crumb })

// ── 对外面（入缝）────────────────────────────────────────
// 术语：入缝 = 从这一层外部调进来的符号（这一层的对外面）；入口 = CLI/HTTP/WS 的程序入口。
// 两者不是一回事——入口只有 162 个且全在 5 个入口容器里；入缝跨顶层域有 438 个。
// 流程图（泳道 = 一条入口一条）不在本页，在点入口之后的 behav-flow 页。
const NOISE = 10, isNoise = s => s.catchall && s.reuse >= NOISE
const real = S.seams.filter(s => !isNoise(s)), noise = S.seams.filter(isNoise)
const st = S.seamStats
let outward
if (isRoot) {
  const rows = Object.entries(SE).filter(([, v]) => v.entryCount).sort((a, b) => b[1].entryCount - a[1].entryCount)
  outward = `<p class="muted" style="font-size:12px;margin:0 0 8px">系统的入口不指向「整个系统」——CLI / HTTP / WS 逻辑上都指向某个子系统。这里按归属列出全部入口。</p>
  ${rows.map(([d, v]) => `<div class="row"><span><a href="?scope=${d}">${SUB[d].label}</a>
    ${v.centralized ? '<span class="ro d3" title="全部入口在同一个文件里注册——不是这个子系统自己注册的">集中注册</span>' : ''}</span>
    <span class="mono">${v.entryCount} 入口 · ${v.entryFiles} 文件</span></div>`).join('')}
  <div class="muted" style="font-size:11px;margin-top:8px">另有 14 个入口判不出归属——全部是分组命令（<span class="mono">handoff card</span> 之类），它们本来就没有行为。</div>`
} else if (!st.total) {
  outward = `<div class="empty">本层没有从外部调进来的符号。${scope === 'd_web' ? '<br>Web 控制台是前端：跨语言（TS↔Go）<b>禁止建调用边</b>，两侧关联走 wire 类型孪生（77 条）——<b>它在调用图上孤立是正确的，不是漏建</b>。' : ''}</div>`
} else {
  const bad = st.catchall / st.total >= .5
  outward = `${bad ? `<div class="empty" style="border-color:var(--debt3);background:#fff8f3;margin-bottom:8px">
      ${st.total} 条对外入缝里 <b>${st.catchall} 条落在兜底桶容器</b>（包级散函数，没有主体）——<b>它的对外面不是契约，是一堆散函数</b>。</div>` : ''}
  ${real.slice(0, 12).map(s => `<div class="lane"><div class="hd">${s.name}
      <span class="pill" style="font-weight:400">被调 ${s.calls}</span>
      <span class="pill" style="font-weight:400">复用度 ${s.reuse}</span>
      ${s.reuse === 0 ? '<span class="ro d4">死契约 · 无入口可达</span>' : ''}
      ${s.catchall ? '<span class="ro d2">兜底桶</span>' : ''}</div>
    <div class="muted" style="font-size:11px">调进来的：${[...new Set(s.from)].join(' · ') || '—'}</div></div>`).join('')
    || '<div class="empty">没有非噪声入缝——对外调用全部打进兜底桶。</div>'}
  ${noise.length ? `<details style="margin-top:6px"><summary class="muted" style="font-size:12px;cursor:pointer">
    ${noise.length} 条工具函数噪声已折叠（兜底桶容器 + 复用度 ≥ ${NOISE}）—— 展开</summary>
    <div style="margin-top:6px">${noise.map(s => `<div class="step noise"><span class="mono">${s.name}</span><span>复用度 ${s.reuse}</span></div>`).join('')}</div></details>` : ''}`
}
// ── 右栏 ────────────────────────────────────────────────
// ── 右栏三个 tab ────────────────────────────────────────
const tab = q('t', 'info')
const tabs = [['info', '基本信息'], ['out', `对外面 (${st.total})`], ['sm', '状态机']]
const decl = S.decl
const panelInfo = `
  ${isRoot ? '' : `<div class="card"><h3>职责</h3><p style="font-size:12px;margin:0">${decl.responsibility || '<span style="color:var(--warn)">未声明</span>'}</p></div>`}
  <div class="card" style="margin-top:10px" id="pick"></div>
  ${isRoot ? '' : `<div class="card" style="margin-top:10px"><h3>不变式</h3>${decl.invariants.length
    ? decl.invariants.map(i => `<div class="row"><span>${i.text}</span><span class="mono muted">${i.testRef || '无测试锚'}</span></div>`).join('')
    : '<div class="empty"><b>未声明</b> —— 23 个领域只有 2 个写了声明</div>'}</div>`}
  <div class="card" style="margin-top:10px"><h3>对外面读数</h3>
    <div class="row"><span>对外入缝</span><span class="mono">${st.total}</span></div>
    <div class="row"><span>落在兜底桶</span><span class="mono">${st.catchall}${st.total ? `（${Math.round(st.catchall * 100 / st.total)}%）` : ''}</span></div>
    <div class="row"><span>只服务一个入口</span><span class="mono">${st.solo}</span></div>
    <div class="row"><span>死契约（无入口可达）</span><span class="mono">${st.dead}</span></div></div>
  ${isRoot ? '' : `<div class="card" style="margin-top:10px"><h3>程序入口</h3>${(() => {
    const rootId = S.path[0], se = SE[rootId] || { entries: [] }
    if (!se.entryCount) return '<div class="empty">本层所属子系统没有对外入口——它只被其他子系统调用。</div>'
    return `<div class="muted" style="font-size:11px;margin-bottom:5px">入口 ≠ 上面的入缝。点入口进流程图。</div>
      ${se.centralized ? '<div class="empty" style="border-color:var(--debt3);background:#fff8f3;margin-bottom:6px"><b>集中注册</b>：全部入口在同一个文件里注册。</div>' : ''}
      ${se.entries.slice(0, 12).map(x => `<div class="row"><span><a class="mono" href="pages/behav-flow.html?e=${encodeURIComponent(x.id)}">${x.name}</a></span></div>`).join('')}
      ${se.entries.length > 12 ? `<div class="muted" style="font-size:11px">…另 ${se.entries.length - 12} 个</div>` : ''}` })()}</div>`}`
const panelOut = `<div class="card"><h3>对外面 · 从外部调进来的符号</h3>
  <div class="muted" style="font-size:11px;margin-bottom:6px">这是这一层的<b>契约面</b>，不是程序入口——程序入口在「基本信息」tab 底部，点它进流程图。</div>
  ${outward}</div>`
const panelSm = `<div class="card"><h3>状态机</h3>${isRoot ? '<div class="empty">根层没有状态机——状态机是领域级声明。</div>' : (decl.stateMachine.length
  ? decl.stateMachine.map(t => `<div class="row"><span class="mono">${t.from} → ${t.to}</span><span class="mono muted">${t.anchor || '无锚'}</span></div>`).join('')
  : `<div class="empty"><b>未声明</b> —— schema 格位已在（<span class="mono">CgDomainDecl.stateMachine</span>），全项目 0 条。<br>
     只能人工声明：<span class="mono">lifecycle</span> 只记「谁写了哪个字段」，记不了状态值（全项目写 <span class="mono">state</span> 的只有 1 条）。</div>`)}
  <div class="muted" style="font-size:11px;margin-top:6px">约定：每条迁移边 ≙ 流程里一个 ✎ 步骤，两图互为印证（数据齐备后可机械执法）。</div></div>`

c.innerHTML = `<div class="banner" style="flex:0 0 auto">${isRoot
  ? '<b>首层就是子系统连线图。</b>上下 = 调用方向，单击看右栏，双击进入下一层。子系统就是顶层领域——「进领域」不是单独动作，双击一路下去就是。'
  : `<b>每一层都是同一个页面</b>，变的只有位置。中间是<b>它由什么组成</b>（${S.kidsAreDomains ? '下一层领域' : '容器——原子节点，到此为止'}），右栏是它的对外面与声明。`}</div>
<div class="stage">
  <div class="pane-l">
    <div class="card">
      <h3 style="padding:2px 4px 6px;flex:0 0 auto">由什么组成 · ${S.kidsAreDomains ? (isRoot ? '子系统' : '领域') : '容器'}（${S.nodes.length}）${S.kidsAreDomains ? '' : '，按包聚成群组'}</h3>
      <div id="cv"></div>
      <div class="legend">
        ${S.kidsAreDomains ? '<span><b>上下 = 调用方向</b>，L0 最外层</span>' : '<span><b>灰框 = 一个包</b>；<b>深色线 = 跨包调用</b>，浅色 = 包内</span>'}
        <span>线宽 = 调用量</span><span><b style="color:#dc2626">⟲ ┄▶</b> 依赖成环</span>
        ${isRoot ? '<span>线色 = 直调债预算</span><span><b style="color:#8b5cf6">┄┄</b> wire 类型关联，不是调用边</span>' : ''}
        ${S.ext.length ? `<span>调出到本层之外：${S.ext.map(e => `<a href="?scope=${e.to}">${SUB[e.to] ? SUB[e.to].label : e.to} ${e.calls}</a>`).join(' · ')}</span>` : ''}
      </div>
    </div>
  </div>
  <div class="splitter" id="sp"></div>
  <div class="pane-r">
    <div class="rtabs">${tabs.map(([k, t]) => `<a href="?scope=${scope}${sel ? '&n=' + sel : ''}&t=${k}" class="${k === tab ? 'on' : ''}">${t}</a>`).join('')}</div>
    <div id="rbody">${tab === 'out' ? panelOut : tab === 'sm' ? panelSm : panelInfo}</div>
  </div>
</div>`
// ── 图 ──────────────────────────────────────────────────
const W = Math.max(440, (document.getElementById('cv').clientWidth || 660) - 8)
const boxOf = nd => nd.kind === 'domain'
  ? { title: nd.label, sub: nd.sub + (nd.children ? ` · ${nd.children} 领域` : ''),
      tag: isRoot && (SE[nd.id] || {}).entryCount ? `▣ ${SE[nd.id].entryCount} 入口${SE[nd.id].centralized ? ' 集中' : ''}` : '',
      tagCls: isRoot && (SE[nd.id] || {}).centralized ? 'bad' : '' }
  : { title: nd.label, mono: true, sub: nd.sub, warn: !!nd.oversized, duty: nd.duty || '', ckind: nd.ckind,
      tag: nd.oversized ? '超粒度' : '', tagCls: nd.oversized ? 'bad' : '' }
const R = S.kidsAreDomains
  ? renderGraph({ el: document.getElementById('cv'), nodes: S.nodes, edges: S.edges, W, sel,
  opt: { bw: isRoot ? 152 : 148, bh: 64 },
  wire: isRoot ? (CG.wire || []).map(w => ({ ...w, tip: `${SUB[w.from].label} ↔ ${SUB[w.to].label}：${w.count} 条 wire 类型关联（${w.kind}）——不是调用边` })) : [],
  box: nd => nd.kind === 'domain'
    ? { title: nd.label, sub: nd.sub + (nd.children ? ` · ${nd.children} 领域` : ''),
        tag: isRoot && (SE[nd.id] || {}).entryCount ? `▣ ${SE[nd.id].entryCount} 入口${SE[nd.id].centralized ? ' 集中' : ''}` : '',
        tagCls: isRoot && (SE[nd.id] || {}).centralized ? 'bad' : '' }
    : { title: nd.label, mono: true, sub: nd.sub, warn: !!nd.oversized,
        tag: nd.oversized ? '超粒度 · 说不出职责' : '', tagCls: nd.oversized ? 'bad' : '' },
  tip: e => { const ed = isRoot ? (CG.topEdges.find(x => x.from === e.from && x.to === e.to) || {}) : {}
    return `${e.calls} 次调用${ed.budget != null ? ' · 直调债预算 ' + ed.budget : ''}${ed.entries && ed.entries.length ? ' · 窄缝 ' + ed.entries.join('/') : ''}` } })
  : renderClusters({ el: document.getElementById('cv'), nodes: S.nodes, edges: S.edges, sel,
      box: boxOf, tip: e => `${e.calls} 次调用` })
if (R.isolated && R.isolated.length) document.getElementById('iso').innerHTML =
  `<div class="muted" style="font-size:11px;margin:8px 0 5px">孤立节点（本层内既不调用别人也不被调用）——不排进 L0，否则等于谎称它们是最外层调用方</div>
   <div style="display:flex;gap:6px;flex-wrap:wrap">${R.isolated.map(nd => `<a class="cbox" style="display:inline-block;padding:5px 8px" href="?scope=${scope}&n=${nd.id}">
     <span class="n">${nd.label}</span> <span class="m" style="display:inline">${nd.symbols} 符号</span></a>`).join('')}</div>`
const nd = S.nodes.find(x => x.id === sel)
const pickEl = document.getElementById('pick')
if (pickEl) pickEl.innerHTML = nd
  ? (nd.kind === 'domain'
      ? `<h3>${nd.label}</h3><p class="muted" style="font-size:12px">${(CG.scopes[nd.id] || { decl: {} }).decl.responsibility || '未声明职责'}</p>
         <div class="row"><span>容器 / 符号</span><span class="mono">${nd.sub.replace(' 容器', '')} / ${nd.symbols}</span></div>
         <div style="margin-top:8px"><a href="?scope=${nd.id}">进入 ${nd.label} →</a></div>`
      : `<h3 class="mono">${nd.label}</h3><div class="row"><span>类别</span><span>${nd.ckind}</span></div>
         <div class="row"><span>符号</span><span class="mono">${nd.symbols}</span></div>
         <div style="margin-top:6px;font-size:12px">${nd.duty || '<span class="muted" style="font-style:italic">无职责主体——「' + nd.ckind + '」不是一个有主体的单位</span>'}</div>
         ${nd.oversized ? '<div class="empty" style="border-color:var(--debt3);background:#fff8f3;margin-top:8px"><b>超粒度</b>——如实报，不折叠圆场。</div>' : ''}
         <div class="muted" style="margin-top:8px;font-size:11px">容器是原子节点——到此为止。它的符号清单不在界面上：
           按「真正的调用链给 agent 看，不给人看」的裁决，那份清单对人没有价值。</div>`)
  : `<h3>选一个${S.kidsAreDomains ? (isRoot ? '子系统' : '领域') : '容器'}</h3>
     <p class="muted" style="font-size:12px;margin:0">单击看它（相连的会一起高亮）${S.kidsAreDomains ? '，双击进入下一层' : '——容器是原子节点，没有下一层'}。</p>`
// 分隔条拖动
;(() => {
  const sp = document.getElementById('sp'), r = document.querySelector('.pane-r')
  const saved = localStorage.getItem('cg.rw'); if (saved) r.style.flexBasis = saved + 'px'
  let d = null
  sp.addEventListener('mousedown', ev => { d = { x: ev.clientX, w: r.getBoundingClientRect().width }; ev.preventDefault(); document.body.style.cursor = 'col-resize' })
  window.addEventListener('mousemove', ev => { if (!d) return
    const w = Math.max(240, Math.min(window.innerWidth * .6, d.w + (d.x - ev.clientX)))
    r.style.flexBasis = w + 'px'; localStorage.setItem('cg.rw', Math.round(w)) })
  window.addEventListener('mouseup', () => { if (d) { d = null; document.body.style.cursor = '' ; location.reload() } })
})()
const T = tab === 'info' ? '' : `&t=${tab}`
document.querySelectorAll('.nd').forEach(g => {
  g.addEventListener('click', () => { location.href = `?scope=${scope}&n=${g.dataset.id}${T}` })
  // 双击只对领域有意义——容器是原子节点，没有下一层可进。
  g.addEventListener('dblclick', () => {
    const k = S.nodes.find(x => x.id === g.dataset.id)
    if (k.kind === 'domain') location.href = `?scope=${k.id}`
  })
})
</script></body></html>
